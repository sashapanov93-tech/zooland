# This file is included from nginx's http {} context.
# Replace zooland.example and certificate paths before enabling it.

limit_req_zone $binary_remote_addr zone=zooland_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=zooland_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=zooland_connections:10m;
log_format zooland_safe '$remote_addr [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

upstream zooland_gunicorn {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name zooland.example www.zooland.example;
    access_log /var/log/nginx/zooland.access.log zooland_safe;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zooland.example www.zooland.example;
    access_log /var/log/nginx/zooland.access.log zooland_safe;

    ssl_certificate /etc/letsencrypt/live/zooland.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zooland.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZooLandTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 50m;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    limit_conn zooland_connections 30;
    limit_conn_status 429;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Старые файлы внутри checkout никогда не должны раздаваться как uploads.
    location ^~ /static/uploads/ {
        return 404;
    }

    # Публикуем только постоянное хранилище. Каталог закрыт от listing, запись
    # разрешена только приложению; Nginx имеет групповой read-only доступ.
    location /uploads/ {
        if ($uri !~* "^/uploads/[A-Za-z0-9][A-Za-z0-9_.-]{0,126}\.(webp|jpe?g|png)$") {
            return 404;
        }
        alias /var/lib/zooland/uploads/;
        try_files $uri =404;
        limit_except GET HEAD {
            deny all;
        }
        disable_symlinks on;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # Nginx не наследует server-level add_header, если location задаёт
        # собственный заголовок, поэтому повторяем защитные значения здесь.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Остальная статика не расходует лимит динамических запросов.
    location ^~ /static/ {
        proxy_pass http://zooland_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        access_log off;
        expires 1h;
    }

    # Токен сброса находится в URL: не записываем его ни в Nginx access log,
    # ни в сокращённый Gunicorn access log.
    location ^~ /password/reset/ {
        limit_req zone=zooland_auth burst=10 nodelay;
        access_log off;
        proxy_pass http://zooland_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Усиленный edge-limit для создания аккаунта, входа и восстановления.
    location ~ ^/(?:login|register|password/forgot|verify-email|admin/verify-login)/?$ {
        limit_req zone=zooland_auth burst=10 nodelay;
        proxy_pass http://zooland_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=zooland_general burst=30 nodelay;
        proxy_pass http://zooland_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
