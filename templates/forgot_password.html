<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Восстановление пароля — ZooLand</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">Z</span><span>Zoo<span>Land</span></span></a><a class="back-link" href="{{ url_for('login') }}">← Ко входу</a></div></header>
<main class="auth-page"><section class="auth-card"><p class="eyebrow">ZooLand</p><h1>Восстановить пароль</h1><p>Укажите email от аккаунта. Ссылка для смены пароля действует 30 минут.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><label>Email<input name="email" type="email" autocomplete="email" required></label><button type="submit">Отправить ссылку</button></form></section></main>{% include "_footer.html" %}<script src="{{ url_for('static', filename='script.js') }}"></script></body></html>
