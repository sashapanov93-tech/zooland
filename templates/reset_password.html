<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый пароль — ZooLand</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">Z</span><span>Zoo<span>Land</span></span></a></div></header>
<main class="auth-page"><section class="auth-card"><p class="eyebrow">ZooLand</p><h1>Новый пароль</h1><p>От 10 до 128 символов. Не используйте имя или email.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><label>Новый пароль<input name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><label>Повторите пароль<input name="confirm_password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><button type="submit">Сохранить пароль</button></form></section></main>{% include "_footer.html" %}<script src="{{ url_for('static', filename='script.js') }}"></script></body></html>
