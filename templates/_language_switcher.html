<div class="language-switcher" data-language-switcher role="group" aria-label="Выбор языка">
    <span class="language-switcher-label" data-language-label>Язык</span>
    <button class="language-switcher-button" type="button" data-language="ru" aria-label="Русский язык" aria-pressed="true" title="Русский">RU</button>
    <button class="language-switcher-button" type="button" data-language="en" aria-label="Английский язык" aria-pressed="false" title="Английский">EN</button>
    <button class="language-switcher-button" type="button" data-language="ka" aria-label="Грузинский язык" aria-pressed="false" title="Грузинский">GE</button>
    <span class="sr-only" data-language-status aria-live="polite" aria-atomic="true"></span>
</div>
