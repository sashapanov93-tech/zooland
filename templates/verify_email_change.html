<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подтверждение email — ZooLand</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">Z</span><span>Zoo<span>Land</span></span></a><a class="back-link" href="{{ url_for('settings') }}">← В настройки</a></div></header><main class="auth-page"><section class="auth-card"><p class="eyebrow">Защита аккаунта</p><h1>Подтвердите новый email</h1><p>Введите шестизначный код, отправленный на {{ email }}.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><label>Код<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label><button type="submit">Подтвердить email</button></form></section></main>{% include "_footer.html" %}<script src="{{ url_for('static', filename='script.js') }}"></script></body></html>
