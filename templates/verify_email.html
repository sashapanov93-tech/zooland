<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подтверждение email — ZooLand</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">Z</span><span>Zoo<span>Land</span></span></a></div></header><main class="auth-page"><section class="auth-card"><p class="eyebrow">ZooLand</p><h1>Подтвердите email</h1><p>Мы отправили шестизначный код на {{ email }}. Код действует 15 минут.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><label>Код из письма<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button type="submit">Подтвердить email</button></form><form method="post" action="{{ url_for('resend_verification_email') }}"><button type="submit" class="link-button">Отправить код повторно</button></form></section></main>{% include "_footer.html" %}<script src="{{ url_for('static', filename='script.js') }}"></script></body></html>
