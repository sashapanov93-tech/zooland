<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка администратора — ZooLand</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">Z</span><span>Zoo<span>Land</span></span></a></div></header>
<main class="auth-page"><section class="auth-card"><p class="eyebrow">Защита администратора</p><h1>Подтвердите вход</h1><p>Одноразовый код отправлен на {{ email }}. Он действует 15 минут.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><label>Код из письма<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label><button type="submit">Подтвердить вход</button></form><form method="post" action="{{ url_for('resend_admin_login_code') }}" class="auth-form secondary-form"><button type="submit" class="back-link">Отправить новый код</button></form></section></main>{% include "_footer.html" %}<script src="{{ url_for('static', filename='script.js') }}"></script></body>
</html>
